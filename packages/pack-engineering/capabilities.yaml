packId: engineering
version: "1"

capabilities:
  - id: project.list_tasks
    required: true
    sideEffect: read
  - id: project.create_task
    required: true
    sideEffect: write
  - id: docs.search_files
    required: true
    sideEffect: read
  - id: chat.search_messages
    required: true
    sideEffect: read
  - id: research.web_search
    required: false
    sideEffect: read
  - id: docs.create_brief
    required: false
    sideEffect: write
  - id: calendar.read_events
    required: false
    sideEffect: read

preferredProviders:
  project.*:
    - linear
    - jira
    - github_projects
    - asana
  docs.*:
    - notion
    - confluence
    - google_workspace
  chat.*:
    - slack
    - teams
  calendar.*:
    - google_workspace
    - outlook
